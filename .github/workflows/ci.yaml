name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plots]"
          pip install pytest pytest-xdist ruff

      - name: Lint audit additions
        run: |
          ruff check --select F,E,W,I \
            tests/cli/test_export_onnx.py \
            tests/cli/test_export_onnx_checkpoint.py \
            tests/data/test_empty_box_augment.py \
            tests/utils/test_auto_batch.py \
            tests/utils/test_checkpoint_compat.py \
            tests/utils/test_ddp.py \
            tests/utils/test_distributed_eval.py \
            tests/utils/test_trainer_accum.py \
            yolox/utils/auto_batch.py

      - name: Run unit tests
        run: |
          python -m pytest tests/utils tests/data tests/cli/test_export_onnx_checkpoint.py tests/cli/test_export_onnx.py -v --tb=short
